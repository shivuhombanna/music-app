    <script>
      (function() {
        // Prevent extension errors from breaking application execution
        window.addEventListener('error', function(event) {
          if (event && (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1)
          )) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);

        // Ensure window.fetch is writable and has a setter for extensions/test runners
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;

          // Patch Window.prototype.fetch if it has a getter without setter
          if (typeof Window !== 'undefined' && Window.prototype) {
            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return currentFetch || (originalFetch ? originalFetch.bind(this) : undefined);
                },
                set: function(val) {
                  currentFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          }

          // Also define own property on window to allow direct assignment
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          // Fallback if defineProperty fails
          try {
            window.fetch = window.fetch;
          } catch (e) {}
        }
      })();
    </script>

  </body>
